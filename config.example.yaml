# flight-deal-finder configuration
# Copy to config.yaml and edit. Every key is optional — omitted keys use the defaults shown.
# Secrets (API key, Twilio credentials) do NOT live here; they come from .env (see .env.example).

api:
  # Override to point at a mock server in tests.
  baseUrl: "https://seats.aero/partnerapi"
  # Self-imposed cap below the API's hard 1,000 calls/day limit (resets midnight UTC).
  dailyCallBudget: 900
  # When estimated remaining calls drop below this, optional /trips detail lookups are skipped.
  reserveCalls: 50

search:
  # Cities to fly from (and return to). 3-letter IATA codes.
  origins: [YYZ, ORD, YVR, LAX]
  # Destination airports (default: Tokyo).
  destinations: [NRT, HND]
  # Name shown in the console and SMS header for the destination.
  destinationLabel: Tokyo
  window:
    # Search window relative to "today", in days.
    startOffsetDays: 0
    # Hard-capped at 355 (award calendars only open ~330-360 days out).
    endOffsetDays: 355
  # seats.aero source ids queried directly (their mileage cost is what you'd pay).
  sources: [aeroplan, flyingblue, qatar]
  # Oneworld proxy: american/alaska records surface JAL/AA space that is bookable
  # with BA or Qatar Avios; prices are ESTIMATED from a static Avios chart.
  proxySources:
    enabled: true
    sources: [american, alaska]
  # true = only alert on nonstop awards. Direct deals are flagged either way.
  directOnly: false
  # Minimum remaining award seats (sources that omit seat counts always pass).
  minSeats: 1

thresholds:
  # Strict less-than, in points.
  onewayMaxPoints: 90000
  # Total for an outbound+return pairing; one leg may exceed the one-way cap.
  roundtripMaxPoints: 180000

roundtrip:
  # Stay length window used when pairing outbounds with returns.
  minStayNights: 3
  maxStayNights: 21
  # true = only pair returns that land back in the outbound's departure city.
  sameCityReturn: false

alerts:
  # digest = at most one SMS per poll cycle.
  mode: digest
  # Re-notify a known deal only if its price drops at least this % below the best price ever alerted...
  realertDropPct: 15
  # ...or if it reappears after being gone at least this many days.
  realertGoneDays: 7
  # Deals beyond these caps are summarized as "+N more" and re-surface next cycle.
  maxOnewaysPerAlert: 8
  maxRoundtripsPerAlert: 4
  # Cap on per-deal /trips detail lookups (flight numbers, taxes, booking links) per cycle.
  maxTripLookupsPerCycle: 25

poll:
  # Hours between cycles. seats.aero refreshes each program only a few times a day,
  # so values below ~1 waste quota without finding more deals.
  intervalHours: 2

sms:
  # Where deal texts go: one or more E.164 numbers, QUOTED — YAML reads an
  # unquoted +14165551234 as a number (e.g. to: ["+14165551234"]).
  to: []
  # Your Twilio phone number (E.164). Credentials come from TWILIO_ACCOUNT_SID /
  # TWILIO_AUTH_TOKEN in .env. Empty to/from = SMS disabled (console still works).
  from: ""
  # Long digests are truncated ("+N more") to stay within this many billed segments.
  maxSegments: 3

# Read-only in the web UI; changing them requires a manual edit + restart.
db:
  path: "./data/deals.db"
server:
  port: 8787
